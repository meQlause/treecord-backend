name: ci-cd

# Every pull request and every merge to master is checked. A merge to master that passes migrates the database and
# deploys the API and the worker to Cloud Run (ADR-021).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  GCP_PROJECT: treecord-512605
  GCP_REGION: asia-southeast1
  IMAGE: asia-southeast1-docker.pkg.dev/treecord-512605/treecord/backend
  SQL_INSTANCE: treecord-512605:asia-southeast1:treecord-db
  API_URL: https://treecord-api-631130167814.asia-southeast1.run.app
  WEB_ORIGIN: https://treecord-web-631130167814.asia-southeast1.run.app
  # public settings shared by the API, the worker and the migration job; secrets come from Secret Manager
  COMMON_ENV: CHAIN_ID=84532,RPC_URL=https://sepolia.base.org,LOG_LEVEL=info,DATABASE_POOL_MAX=5,S3_ENDPOINT=https://storage.googleapis.com,S3_PUBLIC_ENDPOINT=https://storage.googleapis.com,S3_REGION=auto,S3_BUCKET_PREFIX=treecord-512605-

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm check:parity
      - run: pnpm check:frozen
      - run: pnpm vitest run tests/unit

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # signs in to Google Cloud with no stored key (workload identity federation)
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/631130167814/locations/global/workloadIdentityPools/github/providers/github-backend
          service_account: backend-deployer@treecord-512605.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
      - name: Build and push the image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Migrate the database
        # Cloud Run jobs reserve PORT, which the API config the migration reads requires: it is set in the command
        run: |
          gcloud run jobs deploy treecord-migrate \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --image "$IMAGE:$GITHUB_SHA" \
            --command sh --args="-c,PORT=8080 exec node_modules/.bin/tsx scripts/migrate.ts" \
            --service-account "treecord-api@$GCP_PROJECT.iam.gserviceaccount.com" \
            --set-cloudsql-instances "$SQL_INSTANCE" \
            --set-env-vars "$COMMON_ENV,PRIVY_APP_ID=cmvmafmxp01080il0jl4a9x7u,WEB_ORIGIN=$WEB_ORIGIN,PUBLIC_API_URL=$API_URL" \
            --set-secrets "DATABASE_URL=database-url:latest,PRIVY_APP_SECRET=privy-app-secret:latest,ATTESTER_PRIVATE_KEY=attester-private-key:latest,S3_ACCESS_KEY=s3-access-key:latest,S3_SECRET_KEY=s3-secret-key:latest" \
            --max-retries 0 --quiet
          gcloud run jobs execute treecord-migrate --project "$GCP_PROJECT" --region "$GCP_REGION" --wait
      - name: Deploy the API
        # FAUCET_*: a newly stored wallet is sent 0.005 ETH and 100 test USDC once, by the worker's operator wallet
        run: |
          gcloud run deploy treecord-api \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --image "$IMAGE:$GITHUB_SHA" \
            --service-account "treecord-api@$GCP_PROJECT.iam.gserviceaccount.com" \
            --add-cloudsql-instances "$SQL_INSTANCE" \
            --set-env-vars "$COMMON_ENV,PRIVY_APP_ID=cmvmafmxp01080il0jl4a9x7u,WEB_ORIGIN=$WEB_ORIGIN,PUBLIC_API_URL=$API_URL,FAUCET_ETH_WEI=5000000000000000,FAUCET_USDC_UNITS=100000000" \
            --set-secrets "DATABASE_URL=database-url:latest,PRIVY_APP_SECRET=privy-app-secret:latest,ATTESTER_PRIVATE_KEY=attester-private-key:latest,S3_ACCESS_KEY=s3-access-key:latest,S3_SECRET_KEY=s3-secret-key:latest" \
            --allow-unauthenticated --port 8080 --cpu 1 --memory 512Mi --min-instances 0 --max-instances 3 --quiet
      - name: Deploy the worker
        # INDEXER_CHUNK_BLOCKS: the public Base Sepolia RPC answers eth_getLogs for at most 200 blocks, and every call also re-scans 5
        # NFR-076: exactly one relayer-capable process, always running (it polls the chain and the job queue)
        run: |
          gcloud run deploy treecord-worker \
            --project "$GCP_PROJECT" --region "$GCP_REGION" --image "$IMAGE:$GITHUB_SHA" \
            --command node_modules/.bin/tsx --args src/worker.ts \
            --service-account "treecord-worker@$GCP_PROJECT.iam.gserviceaccount.com" \
            --add-cloudsql-instances "$SQL_INSTANCE" \
            --set-env-vars "$COMMON_ENV,WORKER_MODE=all,WORKER_PORT=8080,MOCK_AI=true,INDEXER_CHUNK_BLOCKS=190" \
            --set-secrets "DATABASE_URL=database-url:latest,ATTESTER_PRIVATE_KEY=attester-private-key:latest,OPERATOR_PRIVATE_KEY=operator-private-key:latest,RELAYER_PRIVATE_KEY=relayer-private-key:latest,S3_ACCESS_KEY=s3-access-key:latest,S3_SECRET_KEY=s3-secret-key:latest" \
            --no-allow-unauthenticated --port 8080 --cpu 1 --memory 512Mi \
            --min-instances 1 --max-instances 1 --no-cpu-throttling --quiet
          echo "API: $API_URL" >> "$GITHUB_STEP_SUMMARY"
